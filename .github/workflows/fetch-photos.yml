# Скачивает фото из img/sources.txt, сжимает их и кладёт в img/.
# Запускается сам, когда меняется sources.txt, или вручную во вкладке Actions.
name: Fetch photos

on:
  push:
    branches: [main]
    paths: ["img/sources.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and resize
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          grep -v '^#' img/sources.txt | while read -r name url; do
            [ -z "$name" ] && continue
            if [ -f "img/$name" ]; then
              echo "skip $name"
              continue
            fi
            curl -fsSL -A "Mozilla/5.0" "$url" -o "/tmp/$name"
            convert "/tmp/$name" -auto-orient -strip -resize '1600x1600>' -quality 80 -interlace Plane "img/$name"
            echo "ok $name $(du -h img/$name | cut -f1)"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Добавить фото из Яндекс Карт"
            git push
          fi
